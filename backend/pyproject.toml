[project]
name = "delta-feed-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=6.1.2",
    "django-ninja>=1.7.3",
    "feedparser>=6.0.14",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "delta_feed.config.settings_test"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
per-file-ignores = { "*/migrations/*.py" = ["RUF012", "RUF100"] }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]
